<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mes sessions</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0088CC">

    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.svg">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <h1>Mes sessions</h1>
        <div class="header-actions">
            <!-- Placeholder for potential profile or settings -->
            <button class="icon-btn" aria-label="Paramètres"><i class="fas fa-cog"></i></button>
        </div>
    </header>

    <main id="app-container" class="container">
        <!-- Dynamic Content will be injected here -->
    </main>

    <!-- Floating Action Button -->
    <button id="fab-add" class="fab" aria-label="Ajouter">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active" data-target="home">
            <i class="fas fa-home"></i>
            <span>Accueil</span>
        </a>
        <a href="#" class="nav-item" data-target="calendar">
            <i class="fas fa-calendar-alt"></i>
            <span>Agenda</span>
        </a>
        <a href="#" class="nav-item" data-target="profile">
            <i class="fas fa-user"></i>
            <span>Profil</span>
        </a>
    </nav>

    <!-- Modals -->

    <!-- Add Module Modal -->
    <dialog id="modal-add-module" class="app-modal">
        <form id="form-add-module">
            <div class="modal-header">
                <h3>Nouveau Module</h3>
                <button type="button" class="close-modal" aria-label="Fermer"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="module-title">Titre</label>
                    <input type="text" id="module-title" name="title" required placeholder="Ex: Module 7">
                </div>
                <div class="form-group">
                    <label for="module-location">Lieu</label>
                    <input type="text" id="module-location" name="location" required placeholder="Ex: Rennes">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="module-start">Début</label>
                        <input type="date" id="module-start" name="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="module-end">Fin</label>
                        <input type="date" id="module-end" name="endDate" required>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary close-modal">Annuler</button>
                <button type="submit" class="btn btn-primary">Créer</button>
            </div>
        </form>
    </dialog>

    <!-- Add Hotel Modal -->
    <dialog id="modal-add-hotel" class="app-modal">
        <form id="form-add-hotel">
            <input type="hidden" id="hotel-module-id" name="moduleId">
            <div class="modal-header">
                <h3>Ajouter Hébergement</h3>
                <button type="button" class="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="hotel-name">Nom de l'hôtel</label>
                    <input type="text" id="hotel-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="hotel-address">Adresse</label>
                    <input type="text" id="hotel-address" name="address" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="hotel-checkin">Check-in</label>
                        <input type="date" id="hotel-checkin" name="checkIn" required>
                    </div>
                    <div class="form-group">
                        <label for="hotel-checkout">Check-out</label>
                        <input type="date" id="hotel-checkout" name="checkOut" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="hotel-price">Prix (€)</label>
                        <input type="number" step="0.01" id="hotel-price" name="price" required>
                    </div>
                    <div class="form-group">
                        <label for="hotel-status">Statut</label>
                        <select id="hotel-status" name="status">
                            <option value="pending">À payer</option>
                            <option value="paid">Payé</option>
                        </select>
                    </div>
                </div>
                 <div class="form-group">
                    <label for="hotel-image">Image URL (Optionnel)</label>
                    <input type="url" id="hotel-image" name="image" placeholder="https://...">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary close-modal">Annuler</button>
                <button type="submit" class="btn btn-primary">Ajouter</button>
            </div>
        </form>
    </dialog>

    <!-- Add Transport Modal -->
    <dialog id="modal-add-transport" class="app-modal">
        <form id="form-add-transport">
            <input type="hidden" id="transport-module-id" name="moduleId">
            <div class="modal-header">
                <h3>Ajouter Trajet</h3>
                <button type="button" class="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="transport-title">Titre du trajet</label>
                    <input type="text" id="transport-title" name="title" placeholder="Ex: Paris - Rennes" required>
                </div>
                <div class="form-group">
                    <label for="transport-type">Type</label>
                    <select id="transport-type" name="type">
                        <option value="train">Train</option>
                        <option value="plane">Avion</option>
                        <option value="bus">Bus</option>
                        <option value="car">Voiture</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="transport-outbound">Départ (Aller)</label>
                        <input type="datetime-local" id="transport-outbound" name="outboundDate" required>
                    </div>
                    <div class="form-group">
                        <label for="transport-return">Départ (Retour)</label>
                        <input type="datetime-local" id="transport-return" name="returnDate" required>
                    </div>
                </div>
                 <div class="form-row">
                    <div class="form-group">
                        <label for="transport-price">Prix (€)</label>
                        <input type="number" step="0.01" id="transport-price" name="price" required>
                    </div>
                    <div class="form-group">
                        <label for="transport-status">Statut</label>
                        <select id="transport-status" name="status">
                            <option value="pending">À payer</option>
                            <option value="paid">Payé</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary close-modal">Annuler</button>
                <button type="submit" class="btn btn-primary">Ajouter</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
