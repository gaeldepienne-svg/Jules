<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Investissements</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <h1>Suivi Investissements</h1>
    </header>

    <main class="container">
        <!-- Section Synthèse -->
        <section class="summary-section">
            <div class="card summary-card">
                <h2>Synthèse Globale</h2>
                <div class="summary-grid">
                    <div class="summary-item">
                        <span class="label">Total Investi</span>
                        <span class="value" id="total-invested">0,00 €</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">Valorisation Actuelle</span>
                        <span class="value" id="current-valuation">0,00 €</span>
                    </div>
                    <div class="summary-item highlight">
                        <span class="label">Plus/Moins-value</span>
                        <span class="value" id="total-profit-loss">0,00 €</span>
                        <span class="percent" id="total-profit-loss-percent">(0.00%)</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section Formulaire -->
        <section class="add-section">
            <div class="card">
                <h2><i class="fas fa-plus-circle"></i> Ajouter un mois</h2>
                <form id="add-month-form">
                    <div class="form-group">
                        <label for="month-year">Mois et Année</label>
                        <input type="month" id="month-year" required>
                    </div>
                    <div class="form-group">
                        <label for="monthly-investment">Montant investi ce mois (€)</label>
                        <input type="number" id="monthly-investment" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="end-valuation">Valorisation totale fin de mois (€)</label>
                        <input type="number" id="end-valuation" step="0.01" min="0" required>
                    </div>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </form>
            </div>
        </section>

        <!-- Section Historique -->
        <section class="history-section">
            <div class="card">
                <h2><i class="fas fa-history"></i> Historique</h2>
                <div class="table-responsive">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Mois</th>
                                <th>Investissement Mensuel</th>
                                <th>Cumul Investi</th>
                                <th>Valorisation</th>
                                <th>+/- Value Mensuelle</th>
                                <th>+/- Value Globale</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody">
                            <!-- Rows will be added dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>
</body>
</html>
